# Prometheus — coleta métricas de todos os serviços AgroSmart a cada 5 s.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: ingestao-iot
    static_configs: [{ targets: ["ingestao-iot:9103"] }]
  - job_name: ingestao-visao
    static_configs: [{ targets: ["ingestao-visao:9104"] }]
  - job_name: motor
    static_configs: [{ targets: ["motor:9101"] }]
  - job_name: notificador
    static_configs: [{ targets: ["notificador:9102"] }]
  - job_name: api
    metrics_path: /metrics/
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
