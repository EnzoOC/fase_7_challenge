# ─────────────────────────────────────────────────────────────────────────────
# Pipeline DevSecOps — AgroSmart (Fase 7)
#
#   1. qualidade          lint Python (ruff) + testes com cobertura (pytest)
#                         lint + build do dashboard React (eslint / vite)
#   2. seguranca-codigo   SAST (bandit) · dependências (pip-audit, npm audit)
#                         segredos no repositório (gitleaks) · IaC (trivy config)
#   3. build-containers   build de todas as imagens + varredura de vulnerabilidades (trivy)
#   4. integracao         sobe a plataforma inteira, valida o fluxo ponta a ponta
#                         e roda a mineração de processos sobre o event log real
# ─────────────────────────────────────────────────────────────────────────────
name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # publicar resultados na aba Security (SARIF)

env:
  # Trivy executado direto pela imagem oficial (versão fixada), sem depender de action de terceiros
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.57.1

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: 1 · Qualidade de código e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.txt \
            -r services/motor/requirements.txt -r services/api/requirements.txt

      - name: Lint Python (ruff)
        run: ruff check . --output-format=github

      - name: Testes unitários + cobertura (pytest)
        run: pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=pytest-report.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json

      - name: Lint + build do dashboard (eslint / vite)
        working-directory: services/dashboard
        run: |
          npm ci --no-audit --no-fund
          npx eslint .
          npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-qualidade
          path: |
            coverage.xml
            pytest-report.xml

  seguranca-codigo:
    name: 2 · Segurança do código e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks varre todo o histórico

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas
        run: pip install "bandit[toml,sarif]" pip-audit

      - name: SAST Python (bandit)
        run: |
          bandit -c pyproject.toml -r services process_mining -f sarif -o bandit.sarif --exit-zero
          bandit -c pyproject.toml -r services process_mining --severity-level medium

      - name: Vulnerabilidades em dependências Python (pip-audit)
        run: |
          for req in services/*/requirements.txt process_mining/requirements.txt; do
            echo "::group::$req"
            pip-audit -r "$req" --desc --progress-spinner off
            echo "::endgroup::"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vulnerabilidades em dependências JS (npm audit)
        working-directory: services/dashboard
        run: npm audit --omit=dev --audit-level=high

      - name: Segredos expostos no repositório (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose --report-path /repo/gitleaks.json

      - name: Configuração de infraestrutura — Dockerfiles (trivy config)
        run: |
          docker run --rm -v "$PWD:/repo" ${{ env.TRIVY_IMAGE }} \
            config --severity HIGH,CRITICAL --exit-code 1 /repo

      - name: Publicar SAST na aba Security
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit
        continue-on-error: true

  build-containers:
    name: 3 · Build e varredura das imagens
    runs-on: ubuntu-latest
    needs: [qualidade, seguranca-codigo]
    strategy:
      fail-fast: false
      matrix:
        servico: [ingestao_iot, ingestao_visao, motor, notificador, api, dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: |
          if [ "${{ matrix.servico }}" = "dashboard" ]; then
            docker build -t agrosmart-${{ matrix.servico }}:${{ github.sha }} services/dashboard
          else
            docker build -f services/Dockerfile.python --build-arg SERVICO=${{ matrix.servico }} \
              -t agrosmart-${{ matrix.servico }}:${{ github.sha }} .
          fi

      - name: Varredura de vulnerabilidades (trivy) — relatório
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" -w /repo \
            ${{ env.TRIVY_IMAGE }} image --severity MEDIUM,HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /repo/.trivyignore --exit-code 0 agrosmart-${{ matrix.servico }}:${{ github.sha }}

      - name: Gate de segurança — falha se houver CRITICAL com correção disponível
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" -w /repo \
            ${{ env.TRIVY_IMAGE }} image --severity CRITICAL --ignore-unfixed \
            --ignorefile /repo/.trivyignore --format sarif --output /repo/trivy-${{ matrix.servico }}.sarif \
            --exit-code 1 agrosmart-${{ matrix.servico }}:${{ github.sha }}

      - name: Publicar varredura na aba Security
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.servico }}.sarif
          category: trivy-${{ matrix.servico }}
        continue-on-error: true

  integracao:
    name: 4 · Teste ponta a ponta da plataforma
    runs-on: ubuntu-latest
    needs: build-containers
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Subir a plataforma (docker compose)
        run: |
          cp .env.example .env
          docker compose up -d --build
          docker compose ps

      - name: Aguardar o fluxo completo (entrada → decisão → notificação)
        run: |
          for i in $(seq 1 60); do
            S=$(curl -sf http://localhost:8000/api/stats || true)
            echo "[$i] $S"
            N=$(echo "$S" | python3 -c "import sys,json; print(json.load(sys.stdin)['notificacoes_enviadas'])" 2>/dev/null || echo 0)
            [ "$N" -ge 5 ] && break
            sleep 5
          done
          [ "$N" -ge 5 ] || { echo "::error::fluxo ponta a ponta não completou"; exit 1; }

      - name: Validar status, API, dashboard e monitoramento
        run: |
          set -e
          curl -sf http://localhost:8000/api/status | tee status.json
          python3 -c "import json; s=json.load(open('status.json')); assert s['etapas']['ingestao_iot_motor']=='ok', s"
          curl -sf http://localhost:8000/api/alertas.json > alertas.json
          curl -sf -o /dev/null http://localhost:8080/
          curl -sf -o /dev/null http://localhost:8080/api/telemetria
          curl -sf http://localhost:9090/api/v1/targets | python3 -c "
          import sys, json
          t = json.load(sys.stdin)['data']['activeTargets']
          down = [x['labels']['job'] for x in t if x['health'] != 'up']
          print('targets:', [(x['labels']['job'], x['health']) for x in t])
          assert not down, f'alvos fora: {down}'"
          curl -sf http://localhost:3000/api/health

      - name: Mineração de processos sobre o event log gerado
        run: |
          sleep 60
          docker compose --profile analise run --rm process-mining
          ls -la process_mining/saida

      - name: Coletar evidências (logs e status)
        if: always()
        run: |
          mkdir -p evidencias-ci
          docker compose ps > evidencias-ci/compose-ps.txt
          for s in ingestao-iot ingestao-visao motor notificador api; do
            docker compose logs --no-color --tail 300 $s > evidencias-ci/log-$s.txt
          done
          cp status.json alertas.json evidencias-ci/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-execucao
          path: |
            evidencias-ci/
            process_mining/saida/

      - name: Derrubar a plataforma
        if: always()
        run: docker compose down -v
